services:
  postgresql:
    image: postgres:16-alpine
    container_name: m8m-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-m8m}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: m8m-redpanda
    restart: always
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - internal

  producer:
    image: ${DOCKERHUB_USERNAME:-heygogu}/m8m-producer:latest
    container_name: m8m-producer
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgresql:5432/${POSTGRES_DB:-m8m}"
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      - postgresql
      - redpanda
    networks:
      - internal

  worker:
    image: ${DOCKERHUB_USERNAME:-heygogu}/m8m-worker:latest
    container_name: m8m-worker
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgresql:5432/${POSTGRES_DB:-m8m}"
      KAFKA_BROKERS: "redpanda:9092"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      - postgresql
      - redpanda
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: m8m-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    depends_on:
      - postgresql

volumes:
  redpanda-data:
  postgres-data:

networks:
  internal:
    driver: bridge
